# =============================================================================
# PNPM WORKSPACE CONFIGURATION
# =============================================================================
# Security settings for supply chain protection (pnpm 10.16+)
# Documentation: https://pnpm.io/settings
# =============================================================================

# -----------------------------------------------------------------------------
# WORKSPACE PACKAGES (no active workspace packages)
# -----------------------------------------------------------------------------
# packages:
#   - 'packages/*'
#   - 'apps/*'

# -----------------------------------------------------------------------------
# SUPPLY CHAIN SECURITY
# -----------------------------------------------------------------------------

# Block packages published less than 24 hours ago (zero-day protection)
# CIS Supply Chain Security Benchmark recommends 60 days for critical systems
# 24 hours balances security with development velocity
minimumReleaseAge: 1440

# Prevent trust downgrades (compromised maintainer detection)
# Blocks if package version has weaker authentication than previous releases
# Trust levels: Trusted Publisher > Provenance > No Evidence
trustPolicy: no-downgrade

# Packages excluded from trust policy checks (known false positives)
# semver@6.x: Legacy line without provenance, used by @babel/core
# tailwind-merge@2.x: Published without trusted publisher, used by @modelcontextprotocol/inspector
# ast-v8-to-istanbul@1.0.2+: Switched from trusted-publisher to npm OIDC provenance attestation
#   (stronger security model, not weaker — ERR_PNPM_TRUST_DOWNGRADE is a false positive)
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'tailwind-merge@2.6.1'
  - 'ast-v8-to-istanbul'
  - 'tinyclip'

# Packages excluded from minimum release age (same-day security/compat patches)
# ast-v8-to-istanbul: both 1.0.2 and 1.0.3 published 2026-05-31; needed by @vitest/coverage-v8
# @j0nathan-ll0yd/config: first-party shared config (dprint + tsconfig base) on
#   GitHub Packages; our own package, gates format/typecheck adoption, so it is
#   exempt from the release-age delay.
minimumReleaseAgeExclude:
  - 'ast-v8-to-istanbul'
  # tar: security fast-track, translated from the retired .npmrc
  # `minimum-release-age-exclude[]=tar` (atlas 0032 item 4). Originally added for
  # tar@7.5.3, which fixes GHSA-8qq5-rm4j-mr97 (path traversal); kept bare so the
  # next patch in that line is not delayed behind the 24h floor either.
  - 'tar'
  # Bare package names cover every later version; version-qualified exclusions
  # silently reintroduce the first-publish failure on the next release.
  - '@j0nathan-ll0yd/config'
  # Mantle registry cutover (atlas 0016): the complete transitive closure of
  # this consumer's 14 direct framework dependencies.
  #
  # The closure is a MOVING target, not a one-time census: a framework package can
  # grow a new first-party dependency in a minor release, and that dependency lands
  # here as a transitive the day it ships. @j0nathan-ll0yd/eslint-rules arrived
  # exactly that way — eslint-config 1.0.0 did not depend on it, 1.1.0 pins it at
  # 2.0.0 — and blocked the upgrade until it was listed. When a framework bump fails
  # with ERR_PNPM_NO_MATURE_MATCHING_VERSION on an @j0nathan-ll0yd package, the fix
  # is to add it here, not to weaken minimumReleaseAge for third-party code.
  - '@j0nathan-ll0yd/auth'
  - '@j0nathan-ll0yd/aws'
  - '@j0nathan-ll0yd/cli'
  - '@j0nathan-ll0yd/core'
  - '@j0nathan-ll0yd/database'
  - '@j0nathan-ll0yd/env'
  - '@j0nathan-ll0yd/errors'
  - '@j0nathan-ll0yd/eslint-config'
  - '@j0nathan-ll0yd/eslint-rules'
  - '@j0nathan-ll0yd/mcp'
  - '@j0nathan-ll0yd/observability'
  - '@j0nathan-ll0yd/resilience'
  - '@j0nathan-ll0yd/testing'
  - '@j0nathan-ll0yd/types'
  - '@j0nathan-ll0yd/validation'
  # First-party: Phoenix produces estate-contracts; @j0nathan-ll0yd/cli 2.20.0 pins 0.16.0 exactly.
  - '@j0nathan-ll0yd/estate-contracts'

# Block exotic protocols in transitive dependencies
# Direct deps can use git/tarball, subdeps cannot (common attack vector)
blockExoticSubdeps: true

# Strict build script handling (fail-fast on unexpected scripts)
# Installation will exit non-zero if any deps have unreviewed build scripts
strictDepBuilds: true

# -----------------------------------------------------------------------------
# BUILD SCRIPT ALLOWLIST
# -----------------------------------------------------------------------------
# Explicitly allow packages that require lifecycle scripts
# All other packages have scripts blocked by default
# Audit each package before adding to this list
allowBuilds:
  # Native bindings
  "@lancedb/lancedb": true      # Native bindings for vector DB
  "onnxruntime-node": true      # ML inference runtime (native)

  # Build tools (require native compilation)
  "esbuild": true               # Bundler with native binary
  "dprint": true                # Code formatter with native binary

  # Runtime dependencies with postinstall
  "core-js": true               # Polyfills (telemetry postinstall)
  "protobufjs": true            # Protocol buffers (postinstall)
  "msw": true                   # Mock Service Worker (postinstall)

  # MCP tools
  "@modelcontextprotocol/ext-apps": true  # MCP Inspector extension apps

  # Migrated from package.json pnpm.onlyBuiltDependencies (pnpm 11 drop)
  "@swc/core": true             # TS/JS transform native binary
  "sharp": true                 # Image processing native binary

# -----------------------------------------------------------------------------
# AUDIT
# -----------------------------------------------------------------------------
# The CI `audit` job runs `pnpm audit --audit-level=high` on every pull request and
# push. This is its only exception. Each entry needs a scope, the reason the fix is
# blocked, and a removal condition.
auditConfig:
  ignoreGhsas:
    # GHSA-mrhx-c7xc-m3w5 (zod <4.6.6, high). There is no fixed zod 3.x release.
    # Scope: dev-only. zod 3.25.76 is reached only through @modelcontextprotocol/inspector
    # 0.22.0 (its CLI, client, server and mcp-ui SDK copies) and through chromium-bidi
    # 16.0.1 under puppeteer-core. No untrusted input reaches either. The runtime
    # dependency is zod 4.6.7.
    # Fix blocked: the zod 4 builds of both importers trip `trustPolicy: no-downgrade`.
    # Inspector 2.x needs chokidar@4.0.3, which ships without provenance. puppeteer-core
    # 25.16.0 needs chromium-bidi 157.x, whose publisher changed from GitHub Actions OIDC
    # with provenance to the chrome-devtools-npm account without provenance.
    # Remove when an inspector or puppeteer-core release declares zod 4 WITH provenance
    # through its whole dependency chain, and that importer is upgraded.
    - GHSA-mrhx-c7xc-m3w5

overrides:
  # Security updates for transitive dev tools; see pnpm audit advisories.
  # The CI `audit` job (pnpm audit --audit-level=high) gates regressions. An override
  # is only allowed where every importer's declared range admits the forced version.
  'drizzle-zod>zod': '^4.3.4'
  'undici-types': '7.16.0'
  'ws': '>=8.20.1'
  'protobufjs': '>=7.5.8'
  'esbuild': '>=0.28.1'
  # typed-rest-client 2.3.1 pins qs to exactly 6.15.1 (GHSA-x5fp-wj9c-mxmx,
  # GHSA-4mjr-xmp4-gh2g; fixed in qs 6.16.0). 2.3.0 declares qs ^6.14.1, so it
  # resolves the fixed qs. Its only importer, @stryker-mutator/core (up to 10.1.1),
  # declares ~2.3.0, which admits 2.3.0. Remove when Stryker admits a
  # typed-rest-client whose qs range admits 6.16.0 (3.x declares ^6.16.0).
  'typed-rest-client': '2.3.0'
  # @lancedb/lancedb (up to 0.40.0) declares @huggingface/transformers 3.0.2 as an
  # OPTIONAL dependency. 3.0.2 pulls sharp ^0.33.5 (GHSA-rgj7-g3m4-5g8c,
  # GHSA-wq5f-xc86-pv6w: fixed only in 0.35.4 and 0.35.5) and onnxruntime-node 1.19.2,
  # which pulls adm-zip ^0.5.16 (GHSA-7q85-xj36-vmfc, GHSA-rcw4-f5rp-g42v,
  # GHSA-j5f4-cc29-5x44, GHSA-8238-w5pm-2374, GHSA-vwc7-r8mq-g2x9,
  # GHSA-p634-w6r4-rjp2, GHSA-c6fg-446q-cg94: fixed only in 0.6.1). No fixed version
  # is in range. scripts/embeddings.ts uses our own direct @huggingface/transformers
  # 4.x, and lancedb loads its optional copy lazily inside a try/catch, so drop it.
  # Remove when lancedb's optional transformers moves to a line with fixed sharp and adm-zip.
  '@lancedb/lancedb>@huggingface/transformers': '-'
