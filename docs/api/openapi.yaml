components:
  schemas:
    Models.AppLaunchedEvent:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        eventType:
          type: string
          const: app_launched
        timestamp:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        appVersion:
          type: string
        buildNumber:
          type: string
        osVersion:
          type: string
        deviceModel:
          type: string
      required:
        - eventType
        - timestamp
        - appVersion
        - buildNumber
        - osVersion
        - deviceModel
      additionalProperties: false
    Models.BackgroundTaskCompletedEvent:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        eventType:
          type: string
          const: background_task_completed
        timestamp:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        taskName:
          type: string
        durationMs:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - eventType
        - timestamp
        - taskName
        - durationMs
      additionalProperties: false
    Models.BackgroundTaskExpiredEvent:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        eventType:
          type: string
          const: background_task_expired
        timestamp:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        taskName:
          type: string
      required:
        - eventType
        - timestamp
        - taskName
      additionalProperties: false
    Models.CertificatePinningFailedEvent:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        eventType:
          type: string
          const: certificate_pinning_failed
        timestamp:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        host:
          type: string
        errorMessage:
          type: string
      required:
        - eventType
        - timestamp
        - host
        - errorMessage
      additionalProperties: false
    Models.ClientEventBatchRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        events:
          minItems: 1
          maxItems: 100
          type: array
          items:
            oneOf:
              - type: object
                properties:
                  eventType:
                    type: string
                    const: push_delivered
                  timestamp:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  correlationId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  notificationType:
                    type: string
                    enum:
                      - MetadataNotification
                      - DownloadStartedNotification
                      - DownloadProgressNotification
                      - DownloadReadyNotification
                      - FailureNotification
                required:
                  - eventType
                  - timestamp
                  - correlationId
                additionalProperties: false
              - type: object
                properties:
                  eventType:
                    type: string
                    const: push_received
                  timestamp:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  correlationId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  notificationType:
                    type: string
                    enum:
                      - MetadataNotification
                      - DownloadStartedNotification
                      - DownloadProgressNotification
                      - DownloadReadyNotification
                      - FailureNotification
                required:
                  - eventType
                  - timestamp
                  - correlationId
                additionalProperties: false
              - type: object
                properties:
                  eventType:
                    type: string
                    const: push_opened
                  timestamp:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  correlationId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  notificationType:
                    type: string
                    enum:
                      - MetadataNotification
                      - DownloadStartedNotification
                      - DownloadProgressNotification
                      - DownloadReadyNotification
                      - FailureNotification
                required:
                  - eventType
                  - timestamp
                  - correlationId
                additionalProperties: false
              - type: object
                properties:
                  eventType:
                    type: string
                    const: download_completed_locally
                  timestamp:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  fileId:
                    type: string
                  fileSizeBytes:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  durationMs:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - eventType
                  - timestamp
                  - fileId
                  - fileSizeBytes
                  - durationMs
                additionalProperties: false
              - type: object
                properties:
                  eventType:
                    type: string
                    const: playback_started
                  timestamp:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  fileId:
                    type: string
                  durationSec:
                    type: number
                    minimum: 0
                required:
                  - eventType
                  - timestamp
                  - fileId
                additionalProperties: false
              - type: object
                properties:
                  eventType:
                    type: string
                    const: playback_completed
                  timestamp:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  fileId:
                    type: string
                  playbackDurationSec:
                    type: number
                    minimum: 0
                required:
                  - eventType
                  - timestamp
                  - fileId
                  - playbackDurationSec
                additionalProperties: false
              - type: object
                properties:
                  eventType:
                    type: string
                    const: file_sync_mismatch
                  timestamp:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  localCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  serverCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  missingFileIds:
                    type: array
                    items:
                      type: string
                required:
                  - eventType
                  - timestamp
                  - localCount
                  - serverCount
                additionalProperties: false
              - type: object
                properties:
                  eventType:
                    type: string
                    const: token_refresh_succeeded
                  timestamp:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  sessionId:
                    type: string
                required:
                  - eventType
                  - timestamp
                additionalProperties: false
              - type: object
                properties:
                  eventType:
                    type: string
                    const: token_refresh_failed
                  timestamp:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  errorType:
                    type: string
                  errorMessage:
                    type: string
                required:
                  - eventType
                  - timestamp
                  - errorType
                  - errorMessage
                additionalProperties: false
              - type: object
                properties:
                  eventType:
                    type: string
                    const: session_expired
                  timestamp:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  sessionId:
                    type: string
                required:
                  - eventType
                  - timestamp
                additionalProperties: false
              - type: object
                properties:
                  eventType:
                    type: string
                    const: app_launched
                  timestamp:
