name: 'Setup Node.js and pnpm'
description: 'Standard Node.js and pnpm setup with caching'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4

    - name: Setup Node.js
      id: setup-node
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Report cache status
      shell: bash
      run: |
        if [ "${{ steps.setup-node.outputs.cache-hit }}" = "true" ]; then
          echo "::notice::pnpm cache HIT - dependencies restored from cache"
        else
          echo "::notice::pnpm cache MISS - installing dependencies fresh"
        fi

    # The @j0nathan-ll0yd scope (the Mantle framework packages and the shared
    # dprint + tsconfig config) lives on GitHub Packages, which requires auth even
    # for reads. pnpm ignores the token in the committed project .npmrc, so it
    # must be written to a trusted config here, before install. Uses the run's
    # `permissions: packages: read`.
    - name: Authenticate to GitHub Packages
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
