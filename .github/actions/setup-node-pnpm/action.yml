name: 'Setup Node.js and pnpm'
description: 'Standard Node.js and pnpm setup (cold install, no store cache)'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: '.nvmrc'
        # No `cache: 'pnpm'`. On the self-hosted fleet a restore of the ~406 MB store
        # took 67 s against a 20.5 s cold install on the same head (atlas decision 0168
        # item 5), and the extra tarball filled the VM disk on lockfile-change heads.

    # The @j0nathan-ll0yd scope (the Mantle framework packages and the shared
    # dprint + tsconfig config) lives on GitHub Packages, which requires auth even
    # for reads. pnpm ignores the token in the committed project .npmrc, so it
    # must be written to a trusted config here, before install. Uses the run's
    # `permissions: packages: read`.
    - name: Authenticate to GitHub Packages
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
