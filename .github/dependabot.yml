updates:
- commit-message:
    include: scope
    prefix: chore(deps)
  directory: /
  groups:
    aws-sdk:
      patterns:
      - "@aws-sdk/*"
      update-types:
      - minor
      - patch
    dev-dependencies:
      dependency-type: development
      update-types:
      - patch
    opentelemetry:
      patterns:
      - "@opentelemetry/*"
      update-types:
      - patch
    typescript-eslint:
      patterns:
      - "@typescript-eslint/*"
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: "@aws-sdk/*"
  - dependency-name: "drizzle-orm"
  - dependency-name: "drizzle-kit"
  - dependency-name: "zod"
  - dependency-name: "better-auth"
  - dependency-name: "@better-auth/*"
  - dependency-name: "@opentelemetry/*"
  - dependency-name: "typescript"
  # TS7 hybrid window: do not auto-bump the @typescript/native (TS7) alias until the coordinated
  # cutover. See j0nathan-ll0yd/mantle#257 and the hub plan .omc/plans/typescript-7-upgrade.md.
  - dependency-name: "@typescript/native"
  - dependency-name: "vitest"
  - dependency-name: "@vitest/*"
  - dependency-name: "vite"
  - dependency-name: "unbuild"
  - dependency-name: "dprint"
  - dependency-name: "eslint"
  - dependency-name: "@typescript-eslint/*"
  - dependency-name: "*"
    update-types:
    - version-update:semver-major
  labels:
  - dependencies
  - security
  open-pull-requests-limit: 10
  package-ecosystem: npm
  reviewers:
  - jlloyd
  schedule:
    day: monday
    interval: weekly
    time: "06:00"
    timezone: America/Los_Angeles
- commit-message:
    prefix: chore(ci)
  directory: /
  ignore:
  - dependency-name: "pnpm/action-setup"
    update-types:
    - version-update:semver-major
  - dependency-name: "github/gh-aw-actions*"
  - dependency-name: "actions/checkout"
  - dependency-name: "actions/setup-node"
  - dependency-name: "actions/github-script"
  - dependency-name: "github/gh-aw-actions/**" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  labels:
  - dependencies
  - github-actions
  package-ecosystem: github-actions
  schedule:
    interval: weekly
version: 2
