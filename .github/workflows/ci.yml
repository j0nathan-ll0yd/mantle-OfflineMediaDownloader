name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# packages: read lets the run's GITHUB_TOKEN pull @j0nathan-ll0yd/config
# (shared dprint + tsconfig) from GitHub Packages during install.
permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      # @j0nathan-ll0yd/config (shared dprint + tsconfig) lives on GitHub Packages,
      # which requires auth even for reads. Mantle also consumes it, so pnpm's
      # supply-chain check fetches its metadata during this FIRST install —
      # authenticate before any install. pnpm config set writes the global config,
      # so the token covers both the ../mantle install and the project install.
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck

  typecheck-ts7:
    name: Type Check (TS7 native, advisory)
    # Non-blocking speed + skew detector for the TypeScript 7 hybrid window. The TS6 typecheck job
    # stays the authoritative gate; TS7 (native) is much faster but has known non-determinism, so
    # this lane is advisory (continue-on-error). See the monorepo TS7 plan (mantle#257).
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      # @j0nathan-ll0yd/config (shared dprint + tsconfig) lives on GitHub Packages,
      # which requires auth even for reads. Mantle also consumes it, so pnpm's
      # supply-chain check fetches its metadata during this FIRST install —
      # authenticate before any install. pnpm config set writes the global config,
      # so the token covers both the ../mantle install and the project install.
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check (TS7)
        run: pnpm run typecheck:ts7

