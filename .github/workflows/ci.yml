# EJECTED from Mantle CLI generation (the `# This file is generated by Mantle CLI` header
# has been deliberately removed). `mantle generate ci-templates` overwrites any file that
# still carries that header — see safeWriteGeneratedFile in the CLI's generated-header.ts —
# so leaving it in place while hand-adding the `package-version-drift` job below would mean a
# future regeneration SILENTLY DELETES a blocking gate. A gate that can vanish without anyone
# noticing is the exact failure class this job exists to prevent, so the file is ejected
# instead. `mantle generate ci-templates` now reports "ci.yml (ejected — skipped)"; changes to
# the upstream template must be ported here by hand.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# packages: read lets the run's GITHUB_TOKEN pull @j0nathan-ll0yd/config
# (shared dprint + tsconfig) from GitHub Packages during install.
permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: Type Check
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      # @j0nathan-ll0yd/config (shared dprint + tsconfig) lives on GitHub Packages,
      # which requires auth even for reads. Mantle also consumes it, so pnpm's
      # supply-chain check fetches its metadata during this FIRST install —
      # authenticate before any install. pnpm config set writes the global config,
      # so the token covers both the ../mantle install and the project install.
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck

  typecheck-ts7:
    name: Type Check (TS7 native, advisory)
    # Non-blocking speed + skew detector for the TypeScript 7 hybrid window. The TS6 typecheck job
    # stays the authoritative gate; TS7 (native) is much faster but has known non-determinism, so
    # this lane is advisory (continue-on-error). See the monorepo TS7 plan (mantle#257).
    continue-on-error: true
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      # @j0nathan-ll0yd/config (shared dprint + tsconfig) lives on GitHub Packages,
      # which requires auth even for reads. Mantle also consumes it, so pnpm's
      # supply-chain check fetches its metadata during this FIRST install —
      # authenticate before any install. pnpm config set writes the global config,
      # so the token covers both the ../mantle install and the project install.
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check (TS7)
        run: pnpm run typecheck:ts7

  lint:
    name: Lint & Format
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      # @j0nathan-ll0yd/config (shared dprint + tsconfig) lives on GitHub Packages,
      # which requires auth even for reads. Mantle also consumes it, so pnpm's
      # supply-chain check fetches its metadata during this FIRST install —
      # authenticate before any install. pnpm config set writes the global config,
      # so the token covers both the ../mantle install and the project install.
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check

  test:
    name: Tests
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      # @j0nathan-ll0yd/config (shared dprint + tsconfig) lives on GitHub Packages,
      # which requires auth even for reads. Mantle also consumes it, so pnpm's
      # supply-chain check fetches its metadata during this FIRST install —
      # authenticate before any install. pnpm config set writes the global config,
      # so the token covers both the ../mantle install and the project install.
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: [self-hosted, linux, arm64, node]
    # id-token: write only takes effect when AWS_ROLE_CI_ECR_READ is set (job stays
    # Docker-free and AWS-free otherwise; gate 2c below no-ops on a missing secret).
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Gate 2b (below) diffs this PR against its base branch, which needs the
          # base ref present locally — a depth-1 checkout has only HEAD.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      # @j0nathan-ll0yd/config (shared dprint + tsconfig) lives on GitHub Packages,
      # which requires auth even for reads. Mantle also consumes it, so pnpm's
      # supply-chain check fetches its metadata during this FIRST install —
      # authenticate before any install. pnpm config set writes the global config,
      # so the token covers both the ../mantle install and the project install.
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Docker-free build (no container-Lambda image build/push here — see
      # docker/start-file-upload.pin.README.md). Only esbuild + typecheck run.
      - name: Build
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: pnpm build:ci

      # --- Pin-integrity gate (composite, Docker-free) -----------------------
      # Verifies the committed docker/start-file-upload.pin.json still describes
      # the image that would actually get deployed for this commit. See the plan
      # at .omc/plans/omd-prebuilt-container-lambda-2026-08-16.md ("CI pin-integrity
      # gate") and docker/start-file-upload.pin.README.md.

      # 2a. Bundle match: the pinned image's baked index.mjs must equal the one
      # `pnpm build:ci` just produced for this commit. This is the Docker-free proof
      # that the pinned image still serves this commit's code, and it covers code
      # imported transitively (via #services/*, #domain/*, etc.), not only edits
      # under src/lambdas/sqs/StartFileUpload/.
      - name: Verify pinned bundle hash (gate 2a)
        run: |
          set -euo pipefail
          bundle="build/lambdas/StartFileUpload/index.mjs"
          if [[ ! -f "$bundle" ]]; then
            echo "::error::$bundle was not produced by the build step — cannot verify the pin."
            exit 1
          fi
          actual_hash="sha256:$(sha256sum "$bundle" | cut -d' ' -f1)"
          pinned_hash="$(node -e "console.log(JSON.parse(require('fs').readFileSync('docker/start-file-upload.pin.json','utf8')).bundleHash)")"
          if [[ "$actual_hash" != "$pinned_hash" ]]; then
            echo "::error::StartFileUpload bundle hash mismatch. Pinned bundleHash ($pinned_hash) does not match" \
                 "the bundle produced from this commit ($actual_hash). The handler or a transitively-imported" \
                 "module (e.g. src/services/**, src/domain/**) changed without a repin. Run" \
                 "bin/refresh-download-image.sh to rebuild the image and repin docker/start-file-upload.pin.json."
            exit 1
          fi
          echo "Pinned bundleHash matches this commit's build: $actual_hash"

      # 2b. Non-code inputs: layers/** (cookies, bgutil requirements) and
      # docker/Dockerfile.download are baked into the image but are NOT part of the
      # esbuild bundle, so gate 2a cannot see them change. If either changed in this
      # PR without a pin update, the image is stale.
      - name: Verify non-code image inputs are repinned (gate 2b)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"
          pin_changed="$(grep -c '^docker/start-file-upload\.pin\.json$' <<< "$changed" || true)"
          inputs_changed="$(grep -cE '^(layers/|docker/Dockerfile\.download$)' <<< "$changed" || true)"
          if [[ "$inputs_changed" -gt 0 && "$pin_changed" -eq 0 ]]; then
            echo "::error::layers/** or docker/Dockerfile.download changed in this PR but" \
                 "docker/start-file-upload.pin.json did not. These inputs are baked into the" \
                 "StartFileUpload image but are invisible to gate 2a's bundle hash — image inputs" \
                 "changed; run bin/refresh-download-image.sh to repin."
            exit 1
          fi
          echo "No unrepinned changes to layers/** or docker/Dockerfile.download."

      # 2c. Digest exists in ECR (soft — requires AWS_ROLE_CI_ECR_READ, a
      # USER-provisioned least-privilege role: ecr:DescribeImages + ecr:BatchGetImage
      # scoped to the start-file-upload repo, account 514454346828, us-west-2. Until
      # that role is provisioned this step is skipped entirely; gates 2a/2b above are
      # the correctness-critical, Docker-free, AWS-free stale-image detectors, and
      # `mantle deploy` fails closed if the pinned digest is genuinely missing.
      # (The `secrets` context cannot be read directly in a step `if:` — capture it via
      # a step output first, matching the check-creds pattern in deploy-production.yml.)
      - name: Check ECR-read role configuration (gate 2c)
        id: check-ecr-role
        run: |
          if [ -z "${{ secrets.AWS_ROLE_CI_ECR_READ }}" ]; then
            echo "::notice::AWS_ROLE_CI_ECR_READ is not configured — skipping gate 2c (digest-exists-in-ECR)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure AWS credentials (ECR read, gate 2c)
        if: steps.check-ecr-role.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_CI_ECR_READ }}
          aws-region: us-west-2
      - name: Verify pinned digest exists in ECR (gate 2c)
        if: steps.check-ecr-role.outputs.configured == 'true'
        run: |
          set -euo pipefail
          digest="$(node -e "console.log(JSON.parse(require('fs').readFileSync('docker/start-file-upload.pin.json','utf8')).digest)")"
          if [[ "$digest" == sha256:PENDING* ]]; then
            echo "::warning::pin.digest is still the bootstrap placeholder ($digest) — run" \
                 "bin/refresh-download-image.sh to push a real image before deploying."
            exit 0
          fi
          repo="staging/start-file-upload"
          media_type="$(aws ecr describe-images --repository-name "$repo" --image-ids "imageDigest=$digest" \
            --query 'imageDetails[0].imageManifestMediaType' --output text)"
          # Backstop for the refresh script's --provenance=false/--sbom=false: an OCI image
          # INDEX (or Docker manifest list) is undeployable to AWS Lambda even though the
          # digest itself resolves in ECR, so this must be a hard assertion, not a print.
          case "$media_type" in
            *image.index* | *manifest.list*)
              echo "::error::pin.digest ($digest) resolves in ECR to an OCI image INDEX" \
                   "($media_type), not a single image manifest. AWS Lambda rejects indexes." \
                   "Re-run bin/refresh-download-image.sh (with --provenance=false --sbom=false)" \
                   "to push a deployable single-manifest image and repin."
              exit 1
              ;;
            *)
              echo "OK: pinned digest is a single image manifest ($media_type)."
              ;;
          esac


  conventions:
    name: Convention Checks
    runs-on: [self-hosted, linux, arm64, node]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      # @j0nathan-ll0yd/config (shared dprint + tsconfig) lives on GitHub Packages,
      # which requires auth even for reads. Mantle also consumes it, so pnpm's
      # supply-chain check fetches its metadata during this FIRST install —
      # authenticate before any install. pnpm config set writes the global config,
      # so the token covers both the ../mantle install and the project install.
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check conventions
        run: npx mantle check --severity HIGH

  # Published-package version-drift gate. This repo publishes NOTHING today, so the check
  # short-circuits to exit 0 in well under a second — it is wired now precisely so it is
  # already in place the day a packages/ entry appears, instead of depending on someone
  # remembering. The failure it guards against is silent: `changeset publish` skips a version
  # that already exists in the registry and exits 0, so a source edit without a version bump
  # never reaches consumers and nothing anywhere goes red. This job is the CI mirror of the
  # `package-version-drift` customStep in mantle.config.ts (which only runs in the skippable
  # local pre-push hook).
  #
  # That exit 0 is a REAL answer ("this repo publishes nothing"), not an "I could not tell"
  # dressed up as a pass — and it is contingent, not vacuous: dropping a single non-private
  # packages/*/package.json pointing at npm.pkg.github.com into the tree flips this job to
  # exit 3 immediately, because the drift engine is not installed yet. Verified locally.
  #
  # `name:` is the literal job id rather than a prose title ON PURPOSE: the job name IS the
  # status-check context, and the same context string is used in all four estate repos so a
  # single set of `gh api ... /branches/main/protection` commands covers the estate.
  package-version-drift:
    name: package-version-drift
    runs-on: [self-hosted, linux, arm64, node]
    # Required by `mantle check ci-workflows` (runaway jobs exhaust Actions minutes). Generous
    # relative to the work: with nothing publishable the script exits in under a second, and
    # even once the engine engages the measured cost is a build plus a few seconds of registry
    # I/O. A timeout here is a backstop against a hung network fetch, not a performance budget.
    timeout-minutes: 15
    permissions:
      contents: read
      # Needed the day this repo publishes something: the drift engine authenticates to
      # npm.pkg.github.com to read the payload it compares against, and GitHub Packages
      # returns 401 for anonymous GETs even on public packages.
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history, needed the day this repo publishes something: the engine may need
          # each manifest's own history to resolve the commit that last SET its declared
          # version, and a depth-1 checkout has none — which the engine reports as
          # indeterminate rather than guessing. Set now so the gate is correct on the first
          # day it has anything to inspect, rather than being debugged then.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Self-test the drift gate (A2b)
        # A gate that can never fail is as dangerous as one that never runs — and with no
        # publishable packages here the check passes without exercising the delegation path
        # at all. The self-test is what keeps that pass honest: it proves the evaluator still
        # answers the known-answer vectors, and it enumerates every probe/spawn failure shape
        # to assert that NONE of them can classify as a pass. Proven able to fail: mutating
        # classifyDelegatedRun's killed-engine branch to exit 0 reds this step.
        run: node scripts/check-package-versions.mjs --self-test
      - name: Process-boundary exit-code tests (X2)
        # The step above proves the wrapper's PURE functions return the right values. It says
        # nothing about whether the PROCESS exits with them, and the exit status is the only
        # thing this job communicates. These tests spawn the shipped file as a real child
        # process against fixture repos with a stubbed engine and assert the actual exit code.
        # They matter MORE here than in a repo that publishes something: with nothing
        # publishable, the live run below never reaches the delegation path, so these tests are
        # the only exercise the forwarding and coverage-audit code gets in this repo's CI.
        # Proven able to fail, and to fail SPECIFICALLY: changing the wrapper's final
        # `process.exitCode = delegated.exitCode` to `0` leaves the self-test above green at
        # 70/70 and turns exactly one test here red.
        #
        # These also cover D7, the output-truncation defect: `process.exit()` does not drain
        # buffered stdout, and stdout is a pipe here, so a real DRIFT verdict blocks the merge
        # while printing nothing that says WHY. Measured by reintroducing `process.exit()` and
        # running this file on node 24: on darwin/arm64 the fixture's output falls from 1160430
        # bytes to 131147 with the DRIFT row gone; on THIS runner's arch, linux/arm64, it falls
        # to ZERO BYTES — the gate exits 1 having printed nothing at all. All three D7 rungs go
        # red on every run, on both platforms.
        run: node --test scripts/__tests__/check-package-versions.spawn.test.mjs
      - name: Published-package version drift (blocking)
        # Exit 0 = clean or nothing publishable. Exit 3 = the wrapper could not obtain a
        # verdict (engine missing/unreachable/killed). Any other code is the engine's own
        # verdict, forwarded verbatim.
        run: node scripts/check-package-versions.mjs
        env:
          # Latent here rather than live: this repo publishes nothing today, so the run stops
          # at NO_PUBLISHABLE_PACKAGES and never reaches the registry. The moment OMD publishes
          # its first package the missing credential would turn this gate permanently red with
          # INDETERMINATE, exactly as it did in mantle-LifegamesPortal. A job-level
          # `packages: read` permission scopes the workflow token but does NOT place it in a
          # run step's environment. Mirrors mantle ci.yml and design-system ci.yml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
