      - name: Install mantle dependencies
        working-directory: ../mantle
        run: pnpm install --frozen-lockfile
      - name: Build mantle packages
        working-directory: ../mantle
        run: pnpm build
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check conventions
        run: npx mantle check --severity HIGH
