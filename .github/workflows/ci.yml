# This file is generated by Mantle CLI
# To customize, remove the first line and this file will be skipped on re-generation.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# packages: read lets the run's GITHUB_TOKEN pull @j0nathan-ll0yd/config
# (shared dprint + tsconfig) from GitHub Packages during install.
permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Checkout mantle framework as a sibling directory.
      # actions/checkout@v4 requires path to be within $GITHUB_WORKSPACE,
      # but link: deps point to ../mantle — so we use git clone directly.
      - name: Setup SSH for mantle checkout
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MANTLE_DEPLOY_KEY }}" > ~/.ssh/mantle_deploy_key
          chmod 600 ~/.ssh/mantle_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
      - name: Checkout mantle framework
        # Prefer the PR head ref (then the pushed ref) so an instance PR can be validated against a
        # matching mantle branch; fall back to main when no such branch exists.
        run: GIT_SSH_COMMAND="ssh -i ~/.ssh/mantle_deploy_key -o StrictHostKeyChecking=no" git clone --depth 1 --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-main}}" git@github.com:j0nathan-ll0yd/mantle.git ../mantle || GIT_SSH_COMMAND="ssh -i ~/.ssh/mantle_deploy_key -o StrictHostKeyChecking=no" git clone --depth 1 --branch main git@github.com:j0nathan-ll0yd/mantle.git ../mantle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      # @j0nathan-ll0yd/config (shared dprint + tsconfig) lives on GitHub Packages,
      # which requires auth even for reads. Mantle also consumes it, so pnpm's
      # supply-chain check fetches its metadata during this FIRST install —
      # authenticate before any install. pnpm config set writes the global config,
      # so the token covers both the ../mantle install and the project install.
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
      - name: Install mantle dependencies
        working-directory: ../mantle
        run: pnpm install --frozen-lockfile
      - name: Build mantle packages
        working-directory: ../mantle
        run: pnpm build
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck

  typecheck-ts7:
    name: Type Check (TS7 native, advisory)
    # Non-blocking speed + skew detector for the TypeScript 7 hybrid window. The TS6 typecheck job
    # stays the authoritative gate; TS7 (native) is much faster but has known non-determinism, so
    # this lane is advisory (continue-on-error). See the monorepo TS7 plan (mantle#257).
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
