name: Dependency Updater Watchdog

on:
  schedule:
    # GitHub documents that start-of-hour schedules can be delayed or dropped.
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: dependency-updater-watchdog
  cancel-in-progress: false

jobs:
  audit:
    # This monitor must remain independent of the self-hosted fleet it observes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check updater success recency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          readonly ISSUE_TITLE="Dependency updater schedule watchdog alert"
          NOW="$(date -u +%s)"
          readonly NOW
          failures=()

          check_workflow() {
            local workflow="$1"
            local max_age_hours="$2"
            local payload completed_at completed_epoch age_hours run_url

            payload="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=success&per_page=1")"
            completed_at="$(jq -r '.workflow_runs[0].updated_at // empty' <<< "$payload")"
            run_url="$(jq -r '.workflow_runs[0].html_url // empty' <<< "$payload")"
            if [[ -z "$completed_at" ]]; then
              failures+=("- \`${workflow}\`: no successful run is recorded")
              return
            fi

            completed_epoch="$(date -u -d "$completed_at" +%s)"
            age_hours=$(((NOW - completed_epoch) / 3600))
            if (( age_hours > max_age_hours )); then
              failures+=("- \`${workflow}\`: last success was ${age_hours}h ago (limit ${max_age_hours}h): ${run_url}")
            else
              echo "${workflow}: healthy (${age_hours}h since ${run_url})"
            fi
          }

          # ffmpeg's longest normal Thu->Mon interval is 96h; yt-dlp runs every 168h.
          # The extra day absorbs ordinary queue delay but still detects one dropped event.
          check_workflow "update-ffmpeg.yml" 120
          check_workflow "update-yt-dlp.yml" 216

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "Dependency updater schedule watchdog alert") | .number' \
            | head -1)"

          if (( ${#failures[@]} > 0 )); then
            body_file="${RUNNER_TEMP}/dependency-updater-watchdog.md"
            {
              echo "The independent updater watchdog found stale or missing successful runs:"
              echo
              printf '%s\n' "${failures[@]}"
              echo
              echo "The updater jobs create their own failure issues when they start and fail; this"
              echo "watchdog also covers a dropped schedule event or an unavailable self-hosted fleet."
              echo
              echo "Watchdog run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > "$body_file"

            if [[ -n "$issue_number" ]]; then
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$body_file"
            fi
            exit 1
          fi

          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Both dependency updaters have a successful run inside their expected windows. Closing automatically."
          fi
