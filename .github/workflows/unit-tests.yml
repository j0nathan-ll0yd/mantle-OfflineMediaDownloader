name: Unit Tests

on:
  # PR heads run this workflow once, through the `full-ci` call in
  # pr-checks.yml. A branch-wide `push` and a standalone `pull_request` run
  # repeated the same four jobs twice more per head (atlas decision 0168 item 3).
  # No job here is a required context; `pr-ready` gates on the call's result.
  push:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: unit-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  # Parallel job 1: Validation checks (TypeSpec, API docs, config)
  validate:
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read # read @j0nathan-ll0yd/* (Mantle framework + shared config) from GitHub Packages
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-node-pnpm

      - name: Validate documented scripts exist
        run: ./bin/validate-docs.sh

      - name: Validate documentation sync
        run: pnpm run validate:doc:sync

      - name: Validate docs freshness
        run: pnpm run validate:docs:freshness

      - name: Security audit
        # Non-blocking: surfaces vulnerabilities without failing the build
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Run convention validation (Mantle CLI)
        run: pnpm run check:conventions

      - name: OpenSpec advisory drift report (non-blocking)
        # Drift and behavior-only findings remain advisory. Covers coverage has
        # its own blocking, grandfathered ratchet in the next step.
        continue-on-error: true
        env:
          OPENSPEC_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
        run: |
          set -o pipefail
          npx mantle check openspec | tee openspec-advisory.log
          count=$(grep -oE 'Found [0-9]+ advisory finding' openspec-advisory.log | grep -oE '[0-9]+' | head -1)
          count=${count:-unknown}
          {
            echo "## OpenSpec advisory tether"
            echo ""
            echo "**Advisory findings:** ${count} (non-blocking)"
            echo ""
            echo '```'
            grep -E '^\[ADVISORY\]' openspec-advisory.log || echo "(no advisory categories reported)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::OpenSpec advisory tether: ${count} finding(s) (non-blocking)"
          rm -f openspec-advisory.log

      - name: OpenSpec covers ratchet (blocking on newly uncovered)
        env:
          OPENSPEC_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
        run: pnpm run openspec:covers

      - name: Validate environment variables
        run: pnpm run validate:env-vars

      - name: Validate DSQL migration compatibility
        run: |
          echo "Checking Aurora DSQL migration compatibility..."
          errors=0
          for file in migrations/*.sql; do
            [ -f "$file" ] || continue
            # Skip lambda_roles migration (doesn't contain CREATE INDEX)
            if [[ "$file" == *"lambda_roles"* ]]; then
              continue
            fi
            echo "Checking $file..."
            # Strip SQL comments before checking (lines starting with --)
            sql_content=$(grep -v '^[[:space:]]*--' "$file")
            # Check for CREATE [UNIQUE] INDEX without ASYNC (DSQL requires ASYNC for
            # non-blocking index creation). IF NOT EXISTS without ASYNC is allowed
            # (idempotent recreations; the migration runner adds ASYNC). POSIX awk,
            # not grep: ERE has no lookahead, and the old `grep -E "(?!ASYNC)"`
            # matched nothing on GNU grep, so this arm could never fail. An awk
            # error exits non-zero and fails the step under `bash -e`.
            unsafe_index=$(printf '%s\n' "$sql_content" | awk '
              { u = toupper($0) }
              u ~ /CREATE[[:space:]]+(UNIQUE[[:space:]]+)?INDEX[[:space:]]/ &&
                u !~ /INDEX[[:space:]]+ASYNC([[:space:]]|$)/ &&
                u !~ /IF[[:space:]]+NOT[[:space:]]+EXISTS/ { print }
            ')
            if [ -n "$unsafe_index" ]; then
              echo "ERROR: $file uses CREATE INDEX without ASYNC or IF NOT EXISTS:"
              printf '%s\n' "$unsafe_index" | sed 's/^/  /'
              echo "Aurora DSQL requires CREATE INDEX ASYNC for non-blocking index creation"
              errors=$((errors + 1))
            fi
            # Check for unsupported DSQL features (in actual SQL, not comments)
            if echo "$sql_content" | grep -qi "ALTER TABLE.*DROP COLUMN"; then
              echo "ERROR: $file uses ALTER TABLE DROP COLUMN (not supported in Aurora DSQL)"
              errors=$((errors + 1))
            fi
            if echo "$sql_content" | grep -qi "JSONB"; then
              echo "ERROR: $file uses JSONB (not supported in Aurora DSQL)"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::error::Found $errors DSQL compatibility issues in migrations"
            exit 1
          fi
          echo "All migrations are DSQL-compatible"

      - name: Check DSQL statement breakpoints (mantle db check-dsql)
        # The DSQL migration runner executes each `--> statement-breakpoint` step
        # as one statement, so a step that packs several statements fails at
        # migrate time. check-dsql exits 1 on any such step.
        run: npx mantle db check-dsql

  # Parallel job 2: Type checking and linting
  lint-and-types:
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read # read @j0nathan-ll0yd/* (Mantle framework + shared config) from GitHub Packages
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-homebrew-tools

      - name: Setup SOPS
        uses: ./.github/actions/setup-sops

      - name: Decrypt YouTube cookies
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          echo "$SOPS_AGE_KEY" > /tmp/age-key.txt
          export SOPS_AGE_KEY_FILE=/tmp/age-key.txt
          sops decrypt --output-type binary \
            layers/yt-dlp/cookies/youtube-cookies.enc > layers/yt-dlp/cookies/youtube-cookies.txt

      - name: Build project
        run: pnpm run build:ci

      - name: Check types
        run: pnpm run check:types

      - name: Check test types
        run: pnpm run check:test:types

      - name: Lint code
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Run ShellCheck
        run: shellcheck --severity=error bin/*.sh .github/scripts/*.sh

      - name: Test ESLint local rules
        run: pnpm run test:eslint:rules

      - name: Check Terraform formatting
        run: |
          # Install tofu for formatting check
          if command -v tofu &> /dev/null; then
            tofu fmt -check -recursive infra/
          else
            echo "OpenTofu not installed, skipping Terraform fmt check"
          fi

  # Parallel job 3: Build and validate artifacts
  build-and-validate:
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read # read @j0nathan-ll0yd/* (Mantle framework + shared config) from GitHub Packages
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-homebrew-tools

      - name: Setup SOPS
        uses: ./.github/actions/setup-sops

      - name: Decrypt YouTube cookies
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          echo "$SOPS_AGE_KEY" > /tmp/age-key.txt
          export SOPS_AGE_KEY_FILE=/tmp/age-key.txt
          sops decrypt --output-type binary \
            layers/yt-dlp/cookies/youtube-cookies.enc > layers/yt-dlp/cookies/youtube-cookies.txt

      - uses: ./.github/actions/build-project
        with:
          cache-build: 'true'

      - name: Validate GraphRAG synchronization
        run: pnpm run validate:graphrag

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-output
          path: build/
          retention-days: 1

  # Final job: Run tests after all checks pass
  test:
    needs: [validate, lint-and-types, build-and-validate]
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read # read @j0nathan-ll0yd/* (Mantle framework + shared config) from GitHub Packages
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-node-pnpm

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-output
          path: build/

      - name: Run unit tests
        shell: bash
        run: |
          # pipefail so a vitest failure (incl. coverage ratchet thresholds)
          # propagates through `tee` instead of being masked by tee's exit 0.
          set -o pipefail
          pnpm test --coverage 2>&1 | tee test-output.txt
        env:
          CI: true

      - name: Validate test output
        if: always()
        run: |
          # Check for Vitest deprecation warnings
          if grep -q "DEPRECATED" test-output.txt 2>/dev/null; then
            echo "::error::Found Vitest deprecation warnings in test output"
            grep "DEPRECATED" test-output.txt | head -3
            exit 1
          fi

          # Check for EMF metrics spam (Powertools not silenced)
          if grep -q '"_aws".*"CloudWatchMetrics"' test-output.txt 2>/dev/null; then
            echo "::error::Found Powertools EMF metrics in test output (should be silenced)"
            exit 1
          fi

          # Check for MCR source content warnings
          if grep -q '\[MCR\] not found source content' test-output.txt 2>/dev/null; then
            echo "::error::Found MCR source content warnings in test output"
            grep '\[MCR\] not found' test-output.txt | head -3
            exit 1
          fi

          echo "Test output is clean"

      - name: Post coverage to job summary
        if: always() && hashFiles('coverage/unit/coverage-summary.md') != ''
        run: |
          echo "## Unit Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          cat coverage/unit/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post timing summary
        if: always()
        run: |
          {
            echo ""
            echo "## CI Job Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Validate | ${{ needs.validate.result }} |"
            echo "| Lint & Types | ${{ needs.lint-and-types.result }} |"
            echo "| Build | ${{ needs.build-and-validate.result }} |"
            echo "| Tests | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
