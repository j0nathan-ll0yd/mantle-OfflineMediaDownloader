name: Integration Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: integration-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  integration-tests:
    runs-on: [self-hosted, linux, arm64, node-integration]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read # read @j0nathan-ll0yd/* (Mantle framework + shared config) from GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        # Pinned to v5 — v6.x silently installs pnpm v11 which cannot parse v10
        # lockfiles in multi-repo CI (ERR_PNPM_BROKEN_LOCKFILE). See action-setup#225.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5.0.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # The @j0nathan-ll0yd scope (the Mantle framework packages and the shared
      # dprint + tsconfig config) lives on GitHub Packages, which requires auth
      # even for reads. pnpm ignores the token in the committed project .npmrc,
      # so it must be written to a trusted config here, before the first install.
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Set sidecar endpoints
        run: |
          echo "AWS_ENDPOINT_URL=http://${LOCALSTACK_HOST:-localhost}:4566" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgres://${POSTGRES_USER:-test}:${POSTGRES_PASSWORD:-test}@${POSTGRES_HOST:-localhost}:5432/${POSTGRES_DB:-media_downloader_test}" >> "$GITHUB_ENV"

      # Note: Type checking and linting removed - unit-tests workflow handles these

      - name: Create test results directory
        run: mkdir -p test-results

      - name: integration-tests
        id: integration-tests
        run: |
          # Capture start time
          START_TIME=$(date +%s)

          # Run tests with automatic retry on failure
          # First attempt
          if pnpm run test:integration --coverage; then
            echo "Tests passed on first attempt"
            echo "attempt=1" >> "$GITHUB_OUTPUT"
          else
            echo "First attempt failed, retrying..."
            echo ""
            # Second attempt - clear any stale state first
            sleep 5
            if pnpm run test:integration --coverage; then
              echo "Tests passed on retry"
              echo "attempt=2" >> "$GITHUB_OUTPUT"
              echo "⚠️ Tests required CI-level retry to pass" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Tests failed after retry"
              echo "attempt=failed" >> "$GITHUB_OUTPUT"
              # Capture duration even on failure
              END_TIME=$(date +%s)
              DURATION=$((END_TIME - START_TIME))
              echo "duration=${DURATION}" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          # Capture duration on success
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "duration=${DURATION}" >> "$GITHUB_OUTPUT"
        env:
          CI: true
          USE_LOCALSTACK: true
          LOG_LEVEL: WARN

      - name: Parse flaky tests from JUnit report
        if: always() && hashFiles('test-results/integration-results.xml') != ''
        run: |
          # Extract retried tests from JUnit XML (tests with retries have multiple testcase entries)
          # JUnit format: <testcase name="..." classname="..." time="...">
          # Retried tests will show in the report with "retry #N" in their output

          # Count total tests, failures, and errors from JUnit
          if command -v xmllint &> /dev/null; then
            TESTS=$(xmllint --xpath "string(//testsuite/@tests)" test-results/integration-results.xml 2>/dev/null || echo "0")
            FAILURES=$(xmllint --xpath "string(//testsuite/@failures)" test-results/integration-results.xml 2>/dev/null || echo "0")
            ERRORS=$(xmllint --xpath "string(//testsuite/@errors)" test-results/integration-results.xml 2>/dev/null || echo "0")
            TIME=$(xmllint --xpath "string(//testsuite/@time)" test-results/integration-results.xml 2>/dev/null || echo "0")
          else
            TESTS=0
            FAILURES=0
            ERRORS=0
            TIME=0
          fi

          {
            echo "## Integration Test Results"
            echo ""
            if command -v xmllint &> /dev/null; then
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| Total Tests | $TESTS |"
              echo "| Failures | $FAILURES |"
              echo "| Errors | $ERRORS |"
              echo "| Test Duration | ${TIME}s |"
            else
              echo "JUnit report generated at test-results/integration-results.xml"
              echo ""
              echo "| Metric | Value |"
              echo "|--------|-------|"
            fi
            echo "| Total Run Duration | ${{ steps.integration-tests.outputs.duration }}s |"
            echo "| CI Attempt | ${{ steps.integration-tests.outputs.attempt }} |"

            # Check for flaky test warnings in the test output
            if grep -q "\[FLAKY\]" test-results/integration-results.xml 2>/dev/null; then
              echo ""
              echo "### Flaky Tests Detected"
              echo ""
              echo "The following tests required retries to pass:"
              echo ""
              grep -o '\[FLAKY\][^<]*' test-results/integration-results.xml | head -20 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Write metrics JSON for artifact
          cat > test-results/metrics.json << EOF
          {
            "totalTests": $TESTS,
            "failures": $FAILURES,
            "errors": $ERRORS,
            "testDuration": "$TIME",
            "runDuration": "${{ steps.integration-tests.outputs.duration }}",
            "ciAttempt": "${{ steps.integration-tests.outputs.attempt }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Post coverage to job summary
        if: always() && hashFiles('coverage/integration/coverage-summary.md') != ''
        run: |
          {
            echo ""
            echo "## Integration Test Coverage"
            cat coverage/integration/coverage-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

      - name: Capture diagnostics on failure
        if: failure()
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-west-2
        run: |
          ENDPOINT="http://${LOCALSTACK_HOST:-localhost}:4566"

          echo "=== PostgreSQL Active Connections ==="
          PGPASSWORD="${POSTGRES_PASSWORD:-test}" psql -h "${POSTGRES_HOST:-localhost}" -U "${POSTGRES_USER:-test}" -d "${POSTGRES_DB:-media_downloader_test}" -c "SELECT pid, usename, state, query_start, left(query, 80) as query FROM pg_stat_activity WHERE datname = '${POSTGRES_DB:-media_downloader_test}'" 2>/dev/null || echo "Could not query pg_stat_activity"
          echo ""

          echo "=== PostgreSQL Schemas ==="
          PGPASSWORD="${POSTGRES_PASSWORD:-test}" psql -h "${POSTGRES_HOST:-localhost}" -U "${POSTGRES_USER:-test}" -d "${POSTGRES_DB:-media_downloader_test}" -c "\dn" 2>/dev/null || echo "Could not list schemas"
          echo ""

          echo "=== SQS Queues ==="
          aws --endpoint-url="$ENDPOINT" sqs list-queues 2>/dev/null || echo "Could not list SQS queues"
          echo ""

          echo "=== EventBridge Event Buses ==="
          aws --endpoint-url="$ENDPOINT" events list-event-buses 2>/dev/null || echo "Could not list EventBridge buses"
          echo ""

          echo "=== EventBridge Rules ==="
          aws --endpoint-url="$ENDPOINT" events list-rules 2>/dev/null || echo "Could not list EventBridge rules"
          echo ""

          echo "=== LocalStack Service Status ==="
          curl -s "http://${LOCALSTACK_HOST:-localhost}:4566/_localstack/health" | jq 2>/dev/null || echo "Could not fetch LocalStack health"
          echo ""
