name: Dependency Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  dependency-check:
    name: Validate Dependencies
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/setup-node-pnpm

      - name: Security audit
        # express-rate-limit CVE in @modelcontextprotocol/inspector (devDep only, not in production bundle)
        # pnpm trust-downgrade protection blocks the patched version (missing provenance attestation)
        run: pnpm audit --audit-level=high --ignore GHSA-46wh-pxpv-q5gq

      - name: Check stale pnpm overrides
        run: node .github/scripts/check-upstream-issues.mjs

      - name: Check dependency rules
        run: pnpm run deps:check

      # Note: GraphRAG validation removed - unit-tests workflow handles this

      - name: Generate dependency report
        if: failure()
        run: |
          pnpm run deps:report || true
          echo "Dependency violations found. See job summary for details."

      - name: Upload dependency report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: reports/dependency-report.html

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Dependency Check Failed**\n\nArchitectural violations were detected. Please review the dependency report artifact for details.\n\nCommon issues:\n- Circular dependencies\n- Cross-Lambda imports\n- Direct AWS SDK imports (use vendor wrappers)\n- Entity cross-dependencies'
            })
