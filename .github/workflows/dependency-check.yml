name: Dependency Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  dependency-check:
    name: Validate Dependencies
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      packages: read # read @j0nathan-ll0yd/config from GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-node-pnpm

      - name: Security audit
        # Non-blocking: surfaces vulnerabilities in PR without failing the build.
        # Overrides fix known transitive vulns; new findings are informational until triaged.
        continue-on-error: true
        run: |
          echo "## Security Audit" >> "$GITHUB_STEP_SUMMARY"
          if pnpm audit --audit-level=high 2>&1 | tee /tmp/audit-output.txt; then
            echo "No high-severity vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/audit-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Note:** This is informational. Review findings and add pnpm overrides or dependency updates as needed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check stale pnpm overrides
        run: node .github/scripts/check-upstream-issues.mjs

      - name: Check dependency rules
        run: pnpm run deps:check

      # Note: GraphRAG validation removed - unit-tests workflow handles this

      - name: Generate dependency report
        if: failure()
        run: |
          pnpm run deps:report || true
          echo "Dependency violations found. See job summary for details."

      - name: Upload dependency report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-report
          path: reports/dependency-report.html

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Dependency Check Failed**\n\nArchitectural violations were detected. Please review the dependency report artifact for details.\n\nCommon issues:\n- Circular dependencies\n- Cross-Lambda imports\n- Direct AWS SDK imports (use vendor wrappers)\n- Entity cross-dependencies'
            })
