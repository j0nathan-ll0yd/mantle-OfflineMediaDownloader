name: Update yt-dlp Binary

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2am UTC
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: yt-dlp-update
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-gh

      - name: Check for yt-dlp updates
        id: check
        run: |
          set -e

          echo "Fetching latest stable yt-dlp release (excluding pre-releases)..."
          LATEST=$(gh api repos/yt-dlp/yt-dlp/releases \
            --jq '[.[] | select(.prerelease == false)][0].tag_name')

          # Single source of truth: the ARG YTDLP_VERSION line in the Dockerfile
          # (the StartFileUpload container's runtime binary).
          CURRENT=$(grep -E '^ARG YTDLP_VERSION=' docker/Dockerfile.download | head -1 | cut -d= -f2 | tr -d '[:space:]' || echo "none")

          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"

          if [ "$LATEST" != "$CURRENT" ]; then
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Update available: ${CURRENT} → ${LATEST}"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Already on latest version: ${CURRENT}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check for existing PR
        if: steps.check.outputs.update_needed == 'true'
        id: pr_check
        run: |
          set -e
          VERSION="${{ steps.check.outputs.latest }}"
          BRANCH_NAME="chore/update-yt-dlp-${VERSION}"

          EXISTING_PR=$(gh pr list \
            --head "${BRANCH_NAME}" \
            --state open \
            --json number,url \
            --jq '.[0].url // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Open PR already exists for ${VERSION}: ${EXISTING_PR}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download and verify binary for testing
        if: steps.check.outputs.update_needed == 'true' && steps.pr_check.outputs.skip != 'true'
        run: |
          set -e

          VERSION="${{ steps.check.outputs.latest }}"

          # Deployment target is x86_64 (see docker/Dockerfile.download and the
          # `architecture = "x86_64"` Lambda config), so we verify the x86_64
          # `yt-dlp_linux` asset. This job runs on arm64 self-hosted runners, so we
          # cannot execute the x86_64 binary here (that would fail with "Exec format
          # error"). The SHA256 checksum against the release's SHA2-256SUMS is an
          # architecture-agnostic integrity gate that confirms the tag and asset
          # exist and are intact — sufficient to open a VERSION-bump PR.
          echo "Downloading yt-dlp ${VERSION} for verification..."
          wget -q "https://github.com/yt-dlp/yt-dlp/releases/download/${VERSION}/yt-dlp_linux"
          wget -q "https://github.com/yt-dlp/yt-dlp/releases/download/${VERSION}/SHA2-256SUMS"

          echo "Verifying SHA256 checksum of x86_64 yt-dlp_linux..."
          grep "yt-dlp_linux$" SHA2-256SUMS | sha256sum --check --status

          rm -f yt-dlp_linux SHA2-256SUMS
          echo "Binary verification complete"

      - name: Ensure required labels exist
        if: steps.check.outputs.update_needed == 'true' && steps.pr_check.outputs.skip != 'true'
        run: |
          set -e

          create_label_if_missing() {
            local name="$1"
            local description="$2"
            local color="$3"

            if ! gh label list --json name --jq '.[].name' | grep -q "^${name}$"; then
              echo "Creating label: ${name}"
              gh label create "${name}" --description "${description}" --color "${color}" || true
            fi
          }

          create_label_if_missing "dependencies" "Dependency updates" "0366d6"
          create_label_if_missing "automated" "Automated by GitHub Actions" "bfd4f2"
          create_label_if_missing "yt-dlp" "Related to yt-dlp binary" "fbca04"
          create_label_if_missing "bug" "Something is not working" "d73a4a"
          create_label_if_missing "automation" "CI/CD automation issues" "c2e0c6"
          create_label_if_missing "infrastructure" "Infrastructure changes" "d4c5f9"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Bump Dockerfile ARG and create PR
        if: steps.check.outputs.update_needed == 'true' && steps.pr_check.outputs.skip != 'true'
        run: |
          set -e

          readonly VERSION="${{ steps.check.outputs.latest }}"
          readonly CURRENT_VERSION="${{ steps.check.outputs.current }}"
          readonly BRANCH_NAME="chore/update-yt-dlp-${VERSION}"

          echo "Bumping ARG YTDLP_VERSION to ${VERSION} in docker/Dockerfile.download..."
          tmp="$(mktemp)"
          sed "s|^ARG YTDLP_VERSION=.*|ARG YTDLP_VERSION=${VERSION}|" docker/Dockerfile.download > "$tmp"
          mv "$tmp" docker/Dockerfile.download

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clean up stale remote branch if it exists (from closed/merged PRs)
          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" > /dev/null 2>&1; then
            echo "Removing stale remote branch ${BRANCH_NAME}..."
            git push origin --delete "${BRANCH_NAME}"
          fi

          git checkout -b "${BRANCH_NAME}"
          git add docker/Dockerfile.download
          git commit -m "chore(deps): update yt-dlp to ${VERSION}"
          git push origin "${BRANCH_NAME}"

          cat > /tmp/pr-body.md << EOF
          Automated update of yt-dlp version to ${VERSION}.

          **Release Notes**: https://github.com/yt-dlp/yt-dlp/releases/tag/${VERSION}

          ## Changes
          - Bumped \`ARG YTDLP_VERSION\` in \`docker/Dockerfile.download\` from ${CURRENT_VERSION} to ${VERSION}
          - The new binary is baked into the StartFileUpload container image at build time (\`ADD .../\${YTDLP_VERSION}/yt-dlp_linux\`)

          ## Pre-merge Verification
          - [x] x86_64 \`yt-dlp_linux\` downloaded and SHA256 checksum verified against the release's SHA2-256SUMS
          - [ ] CI/CD tests pending

          ## Deployment Process
          1. Merge this PR
          2. Run \`pnpm run build\` to rebuild the StartFileUpload container with the new yt-dlp
          3. Run \`pnpm run deploy:staging\` to push the new image
          4. Monitor CloudWatch logs for any download issues after deployment

          ## Rollback Procedure
          If issues occur after deployment:
          \`\`\`bash
          sed -i '' "s|^ARG YTDLP_VERSION=.*|ARG YTDLP_VERSION=${CURRENT_VERSION}|" docker/Dockerfile.download  # macOS; drop the '' on Linux
          git commit -am "chore(deps): revert yt-dlp to ${CURRENT_VERSION}"
          git push
          pnpm run build && pnpm run deploy:staging
          \`\`\`
          EOF

          gh pr create \
            --title "chore(deps): update yt-dlp to ${VERSION}" \
            --body-file /tmp/pr-body.md \
            --label "dependencies" \
            --label "automated" \
            --label "yt-dlp" \
            --label "infrastructure"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Notify on failure
        if: failure()
        run: |
          ISSUE_TITLE="yt-dlp update workflow failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          EXISTING_ISSUE=$(gh issue list \
            --state open \
            --search "in:title ${ISSUE_TITLE}" \
            --json number,title \
            --jq '.[] | select(.title == "'"${ISSUE_TITLE}"'") | .number' \
            | head -1)

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Adding comment to existing issue #${EXISTING_ISSUE}..."
            gh issue comment "${EXISTING_ISSUE}" \
              --body "Workflow failed again. See [run](${RUN_URL})."
          else
            echo "Creating new issue..."
            gh issue create \
              --title "${ISSUE_TITLE}" \
              --body "The automated yt-dlp update workflow failed. Check [workflow run](${RUN_URL})." \
              --label "bug" \
              --label "automation" \
              --label "yt-dlp"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
