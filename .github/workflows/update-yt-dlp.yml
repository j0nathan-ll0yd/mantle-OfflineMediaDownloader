name: Update yt-dlp Binary

on:
  schedule:
    - cron: '23 2 * * 0'  # Avoid GitHub's start-of-hour schedule congestion
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: yt-dlp-update
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 15
    outputs:
      # A retry may find the automation PR that an earlier run already created.
      repin_branch: ${{ steps.bump.outputs.branch_name || steps.pr_check.outputs.branch_name }}
      repin_sha: ${{ steps.bump.outputs.branch_sha || steps.pr_check.outputs.branch_sha }}
      latest_version: ${{ steps.check.outputs.latest }}
      latest_sha256: ${{ steps.asset.outputs.sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-gh

      - name: Check for yt-dlp updates
        id: check
        run: |
          set -e

          echo "Fetching latest stable yt-dlp release (excluding pre-releases)..."
          LATEST=$(gh api repos/yt-dlp/yt-dlp/releases \
            --jq '[.[] | select(.prerelease == false)][0].tag_name')

          # A publisher-controlled tag must remain data all the way through the workflow.
          # yt-dlp stable tags use the date form below; reject shell/ref/URL metacharacters.
          if [[ ! "$LATEST" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::Unexpected yt-dlp stable release tag format: ${LATEST@Q}"
            exit 1
          fi

          # Single source of truth: the version/checksum ARG pair for the
          # StartFileUpload container's runtime binary.
          CURRENT=$(grep -E '^ARG YTDLP_VERSION=' docker/Dockerfile.download | head -1 | cut -d= -f2 | tr -d '[:space:]' || echo "none")
          CURRENT_SHA256=$(grep -E '^ARG YTDLP_SHA256=' docker/Dockerfile.download | head -1 | cut -d= -f2 | tr -d '[:space:]' || echo "none")
          LATEST_SHA256=$(gh api "repos/yt-dlp/yt-dlp/releases/tags/${LATEST}" \
            --jq '.assets[] | select(.name == "yt-dlp_linux") | .digest | ltrimstr("sha256:")')
          if [[ ! "$LATEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Release metadata did not contain one valid yt-dlp_linux SHA256."
            exit 1
          fi

          {
            echo "latest=${LATEST}"
            echo "latest_sha256=${LATEST_SHA256}"
            echo "current=${CURRENT}"
            echo "current_sha256=${CURRENT_SHA256}"
          } >> "$GITHUB_OUTPUT"

          if [ "$LATEST" != "$CURRENT" ] || [ "$LATEST_SHA256" != "$CURRENT_SHA256" ]; then
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Update available: ${CURRENT} → ${LATEST}"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Already on latest version: ${CURRENT}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check for existing PR
        if: steps.check.outputs.update_needed == 'true'
        id: pr_check
        run: |
          set -euo pipefail
          readonly BRANCH_NAME="chore/update-yt-dlp-${VERSION}"
          git check-ref-format --branch "$BRANCH_NAME" >/dev/null

          EXISTING_PR=$(gh pr list \
            --head "${BRANCH_NAME}" \
            --state open \
            --json number,url,headRefOid,isCrossRepository,baseRefName \
            --jq '.[0] // empty')

          if [ -n "$EXISTING_PR" ]; then
            if [[ "$(jq -r '.isCrossRepository' <<< "$EXISTING_PR")" != "false" || \
                  "$(jq -r '.baseRefName' <<< "$EXISTING_PR")" != "main" ]]; then
              echo "::error::Existing automation PR has an unexpected repository or base branch."
              exit 1
            fi
            branch_sha="$(jq -r '.headRefOid' <<< "$EXISTING_PR")"
            [[ "$branch_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Existing automation PR returned an invalid head SHA."
              exit 1
            }
            {
              echo "skip=true"
              echo "branch_name=${BRANCH_NAME}"
              echo "branch_sha=${branch_sha}"
            } >> "$GITHUB_OUTPUT"
            echo "Open PR already exists for ${VERSION}: $(jq -r '.url' <<< "$EXISTING_PR")"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.latest }}

      - name: Download and verify binary for testing
        if: steps.check.outputs.update_needed == 'true'
        id: asset
        run: |
          set -euo pipefail

          # Deployment target is x86_64 (see docker/Dockerfile.download and the
          # `architecture = "x86_64"` Lambda config), so we verify the x86_64
          # `yt-dlp_linux` asset. This job runs on arm64 self-hosted runners, so we
          # cannot execute the x86_64 binary here (that would fail with "Exec format
          # error"). The SHA256 checksum against the release's SHA2-256SUMS is an
          # architecture-agnostic integrity gate that confirms the tag and asset
          # exist and are intact — sufficient to open a VERSION-bump PR.
          echo "Downloading yt-dlp ${VERSION} for verification..."
          wget -q "https://github.com/yt-dlp/yt-dlp/releases/download/${VERSION}/yt-dlp_linux"
          wget -q "https://github.com/yt-dlp/yt-dlp/releases/download/${VERSION}/SHA2-256SUMS"

          echo "Verifying SHA256 checksum of x86_64 yt-dlp_linux..."
          checksum="$(awk '$2 == "yt-dlp_linux" {print $1}' SHA2-256SUMS)"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Release checksum file did not contain one valid yt-dlp_linux SHA256."
            exit 1
          }
          [[ "$checksum" == "$EXPECTED_SHA256" ]] || {
            echo "::error::Publisher checksum and GitHub's asset digest disagree."
            exit 1
          }
          printf '%s  yt-dlp_linux\n' "$checksum" | sha256sum --check --status
          echo "sha256=${checksum}" >> "$GITHUB_OUTPUT"

          rm -f yt-dlp_linux SHA2-256SUMS
          echo "Binary verification complete"
        env:
          VERSION: ${{ steps.check.outputs.latest }}
          EXPECTED_SHA256: ${{ steps.check.outputs.latest_sha256 }}

      - name: Ensure required labels exist
        if: steps.check.outputs.update_needed == 'true' && steps.pr_check.outputs.skip != 'true'
        run: |
          set -e

          create_label_if_missing() {
            local name="$1"
            local description="$2"
            local color="$3"

            if ! gh label list --json name --jq '.[].name' | grep -q "^${name}$"; then
              echo "Creating label: ${name}"
              gh label create "${name}" --description "${description}" --color "${color}" || true
            fi
          }

          create_label_if_missing "dependencies" "Dependency updates" "0366d6"
          create_label_if_missing "automated" "Automated by GitHub Actions" "bfd4f2"
          create_label_if_missing "yt-dlp" "Related to yt-dlp binary" "fbca04"
          create_label_if_missing "bug" "Something is not working" "d73a4a"
          create_label_if_missing "automation" "CI/CD automation issues" "c2e0c6"
          create_label_if_missing "infrastructure" "Infrastructure changes" "d4c5f9"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Bump Dockerfile ARG and create PR
        id: bump
        if: steps.check.outputs.update_needed == 'true' && steps.pr_check.outputs.skip != 'true'
        run: |
          set -euo pipefail

          readonly CURRENT_VERSION="$PREVIOUS_VERSION"
          readonly CURRENT_SHA256="$PREVIOUS_SHA256"
          readonly SHA256="$YTDLP_SHA256"
          readonly BRANCH_NAME="chore/update-yt-dlp-${VERSION}"
          git check-ref-format --branch "$BRANCH_NAME" >/dev/null
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]

          echo "Bumping the yt-dlp version and verified SHA256 in docker/Dockerfile.download..."
          tmp="$(mktemp)"
          sed -e "s|^ARG YTDLP_VERSION=.*|ARG YTDLP_VERSION=${VERSION}|" \
              -e "s|^ARG YTDLP_SHA256=.*|ARG YTDLP_SHA256=${SHA256}|" \
              docker/Dockerfile.download > "$tmp"
          mv "$tmp" docker/Dockerfile.download
          grep -qxF "ARG YTDLP_VERSION=${VERSION}" docker/Dockerfile.download
          grep -qxF "ARG YTDLP_SHA256=${SHA256}" docker/Dockerfile.download

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clean up stale remote branch if it exists (from closed/merged PRs)
          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" > /dev/null 2>&1; then
            echo "Removing stale remote branch ${BRANCH_NAME}..."
            git push origin --delete "${BRANCH_NAME}"
          fi

          git checkout -b "${BRANCH_NAME}"
          git add docker/Dockerfile.download
          git commit -m "chore(deps): update yt-dlp to ${VERSION}"
          git push origin "${BRANCH_NAME}"
          BRANCH_SHA="$(git rev-parse HEAD)"
          readonly BRANCH_SHA

          cat > /tmp/pr-body.md << EOF
          Automated update of yt-dlp version to ${VERSION}.

          **Release Notes**: https://github.com/yt-dlp/yt-dlp/releases/tag/${VERSION}

          ## Changes
          - Bumped \`ARG YTDLP_VERSION\` in \`docker/Dockerfile.download\` from ${CURRENT_VERSION} to ${VERSION}
          - Pinned \`ARG YTDLP_SHA256\` to the checksum verified from the release's \`SHA2-256SUMS\`
          - The new binary is baked into the StartFileUpload container image at build time (\`ADD .../\${YTDLP_VERSION}/yt-dlp_linux\`)

          ## Pre-merge Verification
          - [x] x86_64 \`yt-dlp_linux\` downloaded and SHA256 checksum verified against the release's SHA2-256SUMS
          - [ ] CI/CD tests pending

          ## Automated image repin
          This changes \`docker/Dockerfile.download\`, so a dependent \`image-build\` job
          rebuilds and pushes the linux/amd64 image, commits the refreshed
          \`docker/start-file-upload.pin.json\` to this branch with the scoped repin PAT,
          and retriggers the PR checks. Do not merge until gates 2a/2b are green.

          After merge, run \`pnpm run deploy:staging\` and monitor CloudWatch logs for
          download issues.

          ## Rollback Procedure
          If issues occur after deployment:
          \`\`\`bash
          sed -i '' -e "s|^ARG YTDLP_VERSION=.*|ARG YTDLP_VERSION=${CURRENT_VERSION}|" \\
                    -e "s|^ARG YTDLP_SHA256=.*|ARG YTDLP_SHA256=${CURRENT_SHA256}|" \\
                    docker/Dockerfile.download  # macOS; drop the '' on Linux
          git commit -am "chore(deps): revert yt-dlp to ${CURRENT_VERSION}"
          git push
          ./bin/refresh-download-image.sh  # rebuilds, pushes, and repins for the reverted version
          git push
          pnpm run deploy:staging
          \`\`\`
          EOF

          gh pr create \
            --title "chore(deps): update yt-dlp to ${VERSION}" \
            --body-file /tmp/pr-body.md \
            --label "dependencies" \
            --label "automated" \
            --label "yt-dlp" \
            --label "infrastructure"

          # Hand the trusted, workflow-created branch to the isolated image-build job.
          # That job pushes with OMD_REFRESH_PAT so the PR's pull_request checks rerun;
          # a github.token push is intentionally suppressed by GitHub anti-recursion.
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          echo "branch_sha=${BRANCH_SHA}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.latest }}
          YTDLP_SHA256: ${{ steps.asset.outputs.sha256 }}
          PREVIOUS_VERSION: ${{ steps.check.outputs.current }}
          PREVIOUS_SHA256: ${{ steps.check.outputs.current_sha256 }}

  repin-image:
    name: Build, push, and repin image
    needs: check-update
    if: needs.check-update.outputs.repin_branch != '' && needs.check-update.outputs.repin_sha != ''
    runs-on: [self-hosted, linux, arm64, image-build]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      # The automation branch is untrusted data until proven otherwise. Never check it out or
      # execute its actions/scripts; reconstruct its one validated ARG change on trusted main.
      - name: Check out the trusted main workflow commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Verify the exact update commit and reconstruct it on trusted main
        id: prepare
        env:
          REPIN_BRANCH: ${{ needs.check-update.outputs.repin_branch }}
          EXPECTED_BRANCH_SHA: ${{ needs.check-update.outputs.repin_sha }}
          TRUSTED_SHA: ${{ github.sha }}
          TRUSTED_REF: ${{ github.ref }}
          VERSION: ${{ needs.check-update.outputs.latest_version }}
          YTDLP_SHA256: ${{ needs.check-update.outputs.latest_sha256 }}
        run: |
          set -euo pipefail

          [[ "$TRUSTED_REF" == "refs/heads/main" ]] || {
            echo "::error::Image repins may run only from refs/heads/main."
            exit 1
          }
          [[ "$EXPECTED_BRANCH_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]
          [[ "$YTDLP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$REPIN_BRANCH" == "chore/update-yt-dlp-${VERSION}" ]]
          git check-ref-format --branch "$REPIN_BRANCH" >/dev/null
          [[ "$(git rev-parse HEAD)" == "$TRUSTED_SHA" ]]

          remote_sha="$(git ls-remote --heads origin "refs/heads/${REPIN_BRANCH}" | awk 'NR == 1 {print $1}')"
          if [[ "$remote_sha" != "$EXPECTED_BRANCH_SHA" ]]; then
            echo "::error::Update branch moved after check-update (expected ${EXPECTED_BRANCH_SHA}, found ${remote_sha:-missing})."
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/heads/${REPIN_BRANCH}:refs/remotes/origin/repin-source"
          [[ "$(git rev-parse refs/remotes/origin/repin-source)" == "$EXPECTED_BRANCH_SHA" ]]

          merge_base="$(git merge-base "$TRUSTED_SHA" "$EXPECTED_BRANCH_SHA")"
          [[ -n "$merge_base" ]]
          changed="$(git diff --name-only "$merge_base" "$EXPECTED_BRANCH_SHA")"
          unexpected="$(grep -vE '^(docker/Dockerfile\.download|docker/start-file-upload\.pin\.json)$' <<< "$changed" || true)"
          if [[ -n "$unexpected" ]] || ! grep -qxF 'docker/Dockerfile.download' <<< "$changed"; then
            echo "::error::Automation branch contains paths outside the dependency Dockerfile and generated pin:"
            printf '%s\n' "$changed"
            exit 1
          fi

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          git show "${merge_base}:docker/Dockerfile.download" > "$verify_dir/expected"
          git show "${EXPECTED_BRANCH_SHA}:docker/Dockerfile.download" > "$verify_dir/actual"
          branch_version="$(grep -E '^ARG YTDLP_VERSION=' "$verify_dir/actual" | cut -d= -f2)"
          branch_sha256="$(grep -E '^ARG YTDLP_SHA256=' "$verify_dir/actual" | cut -d= -f2)"
          [[ "$branch_version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]
          [[ "$branch_sha256" == "$YTDLP_SHA256" ]]
          sed -e 's|^ARG YTDLP_VERSION=.*|ARG YTDLP_VERSION=__VALIDATED__|' \
              -e 's|^ARG YTDLP_SHA256=.*|ARG YTDLP_SHA256=__VALIDATED__|' \
            "$verify_dir/expected" > "$verify_dir/expected.normalized"
          sed -e 's|^ARG YTDLP_VERSION=.*|ARG YTDLP_VERSION=__VALIDATED__|' \
              -e 's|^ARG YTDLP_SHA256=.*|ARG YTDLP_SHA256=__VALIDATED__|' \
            "$verify_dir/actual" > "$verify_dir/actual.normalized"
          if ! cmp -s "$verify_dir/expected.normalized" "$verify_dir/actual.normalized"; then
            echo "::error::Automation branch Dockerfile changes more than the validated yt-dlp version/checksum pair."
            diff -u "$verify_dir/expected.normalized" "$verify_dir/actual.normalized" || true
            exit 1
          fi

          git switch -c "ci-repin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed -e "s|^ARG YTDLP_VERSION=.*|ARG YTDLP_VERSION=${VERSION}|" \
              -e "s|^ARG YTDLP_SHA256=.*|ARG YTDLP_SHA256=${YTDLP_SHA256}|" \
            docker/Dockerfile.download > "$verify_dir/trusted.new"
          mv "$verify_dir/trusted.new" docker/Dockerfile.download
          grep -qxF "ARG YTDLP_VERSION=${VERSION}" docker/Dockerfile.download
          grep -qxF "ARG YTDLP_SHA256=${YTDLP_SHA256}" docker/Dockerfile.download
          [[ "$(git diff --name-only)" == "docker/Dockerfile.download" ]]

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker/Dockerfile.download
          git commit -m "chore(deps): update yt-dlp to ${VERSION}"
          echo "dependency_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials for the staging ECR push
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          # Dedicated OIDC role: main-ref trust plus ECR push access scoped to
          # staging/start-file-upload. Do not reuse the broader staging deploy secret.
          role-to-assume: ${{ secrets.AWS_ROLE_OMD_IMAGE_REPIN }}
          aws-region: us-west-2
          role-session-name: omd-image-repin-${{ github.run_id }}

      - name: Prepare the SOPS age key
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SOPS_AGE_KEY" ]]; then
            echo "::error::SOPS_AGE_KEY is not configured."
            exit 1
          fi
          key_file="${RUNNER_TEMP}/omd-refresh-age-key.txt"
          umask 077
          printf '%s\n' "$SOPS_AGE_KEY" > "$key_file"
          echo "SOPS_AGE_KEY_FILE=${key_file}" >> "$GITHUB_ENV"

      - name: Verify DinD and log in to ECR
        run: |
          set -euo pipefail
          ready=false
          for _ in {1..30}; do
            if docker info >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "::error::The image-build DinD sidecar did not become ready."
            exit 1
          fi
          docker info --format 'DinD server: {{.ServerVersion}} / {{.Architecture}}'
          docker buildx version

          registry="514454346828.dkr.ecr.us-west-2.amazonaws.com"
          aws ecr get-login-password --region us-west-2 \
            | docker login --username AWS --password-stdin "$registry"

      - name: Build, push, and commit the refreshed image pin
        run: |
          set -euo pipefail
          bin/refresh-download-image.sh

      - name: Verify and push only the generated pin commit
        env:
          REPIN_BRANCH: ${{ needs.check-update.outputs.repin_branch }}
          EXPECTED_BRANCH_SHA: ${{ needs.check-update.outputs.repin_sha }}
          DEPENDENCY_SHA: ${{ steps.prepare.outputs.dependency_sha }}
          OMD_REFRESH_PAT: ${{ secrets.OMD_REFRESH_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "$OMD_REFRESH_PAT" ]]; then
            echo "::error::OMD_REFRESH_PAT is not configured."
            exit 1
          fi
          if [[ "$(git rev-list --count "${DEPENDENCY_SHA}..HEAD")" != "1" ]]; then
            echo "::error::Refresh must create exactly one commit after the reconstructed dependency commit."
            exit 1
          fi
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if [[ "$changed" != "docker/start-file-upload.pin.json" ]]; then
            echo "::error::Refresh commit changed an unexpected path:"
            printf '%s\n' "$changed"
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::Refresh left tracked worktree changes behind."
            git status --short --untracked-files=no
            exit 1
          fi
          auth_header="$(printf 'x-access-token:%s' "$OMD_REFRESH_PAT" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push \
            --force-with-lease="refs/heads/${REPIN_BRANCH}:${EXPECTED_BRANCH_SHA}" \
            origin "HEAD:refs/heads/${REPIN_BRANCH}"

      - name: Remove decrypted credentials and registry auth
        if: always()
        run: |
          rm -f -- "${SOPS_AGE_KEY_FILE:-}" layers/yt-dlp/cookies/youtube-cookies.txt
          docker logout 514454346828.dkr.ecr.us-west-2.amazonaws.com >/dev/null 2>&1 || true

  notify-failure:
    name: Report updater failure
    needs: [check-update, repin-image]
    if: >-
      always() &&
      (needs.check-update.result == 'failure' || needs.check-update.result == 'cancelled' ||
       needs.repin-image.result == 'failure' || needs.repin-image.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          readonly ISSUE_TITLE="yt-dlp update workflow failed"
          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title ${ISSUE_TITLE}" \
            --json number,title \
            --jq '.[] | select(.title == "'"${ISSUE_TITLE}"'") | .number' \
            | head -1)"
          if [[ -n "$existing_issue" ]]; then
            gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" \
              --body "Workflow failed again. See [run](${RUN_URL})."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body "The automated yt-dlp update workflow failed. Check [workflow run](${RUN_URL})." \
              --label bug --label automation --label yt-dlp
          fi
