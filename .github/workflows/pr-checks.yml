name: PR Checks

on:
  pull_request:
    branches: [main]

# packages: read must be granted here so the reusable full-ci / integration
# calls below can pass it through to unit-tests.yml / integration-tests.yml,
# whose install jobs read @j0nathan-ll0yd/config from GitHub Packages. A caller
# cannot grant a called workflow more than it holds, so this is the ceiling.
permissions:
  contents: read
  packages: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Quick validation (no build required)
  quick-checks:
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read # read @j0nathan-ll0yd/config from GitHub Packages
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup SSH for mantle checkout
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MANTLE_DEPLOY_KEY }}" > ~/.ssh/mantle_deploy_key
          chmod 600 ~/.ssh/mantle_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
      - name: Checkout mantle framework
        run: GIT_SSH_COMMAND="ssh -i ~/.ssh/mantle_deploy_key -o StrictHostKeyChecking=no" git clone --depth 1 --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-main}}" git@github.com:j0nathan-ll0yd/mantle.git ../mantle || GIT_SSH_COMMAND="ssh -i ~/.ssh/mantle_deploy_key -o StrictHostKeyChecking=no" git clone --depth 1 --branch main git@github.com:j0nathan-ll0yd/mantle.git ../mantle

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install mantle dependencies
        working-directory: ../mantle
        run: pnpm install --frozen-lockfile
      - name: Build mantle packages
        working-directory: ../mantle
        run: pnpm build

      - name: Format Check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

  # Full CI (depends on quick checks)
  full-ci:
    needs: quick-checks
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  integration:
    needs: quick-checks
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit

  # Final status check for branch protection
  pr-ready:
    needs: [quick-checks, full-ci, integration]
    runs-on: [self-hosted, linux, arm64, base]
    timeout-minutes: 5
    if: always()
    permissions:
      contents: read
      packages: read # read @j0nathan-ll0yd/config from GitHub Packages
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.full-ci.result }}" != "success" ]; then
            echo "::error::Unit tests failed"
            exit 1
          fi
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "::error::Integration tests failed"
            exit 1
          fi
          echo "All checks passed!"

      - name: Post summary
        run: |
          {
            echo "## PR Check Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Quick Checks | ${{ needs.quick-checks.result }} |"
            echo "| Unit Tests | ${{ needs.full-ci.result }} |"
            echo "| Integration Tests | ${{ needs.integration.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
