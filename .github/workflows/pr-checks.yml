name: PR Checks

on:
  pull_request:
    branches: [main]
    # A bare `pull_request:` defaults to [opened, synchronize, reopened]; `ready_for_review`
    # is not in that set, so flipping a draft to ready re-runs nothing and leaves a stale
    # green in place. A `types:` key REPLACES the defaults, so all four are listed.
    types: [opened, synchronize, reopened, ready_for_review]

# packages: read must be granted here so the reusable full-ci call below can
# pass it through to unit-tests.yml, whose install jobs read
# @j0nathan-ll0yd/config from GitHub Packages. A caller cannot grant a called
# workflow more than it holds, so this is the ceiling.
permissions:
  contents: read
  packages: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Unit Tests runs only through this call on a PR head (atlas decision 0168
  # item 3). It starts at once: the former quick-checks job only repeated the
  # lint and format checks that `Lint & Format` (ci.yml) and `lint-and-types`
  # already run, and held this call back by about 175 s (decision 0168 item 4).
  # Integration Tests is not called here: its own `pull_request` run produces
  # the required `integration-tests` context, once per head.
  full-ci:
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  # Final status check for branch protection. `if: always()` plus the explicit
  # success test means a skipped or cancelled full-ci reads as failure
  # (decision 0152).
  pr-ready:
    needs: [full-ci]
    runs-on: [self-hosted, linux, arm64, base]
    timeout-minutes: 5
    if: always()
    permissions:
      contents: read
      packages: read # read @j0nathan-ll0yd/* (Mantle framework + shared config) from GitHub Packages
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.full-ci.result }}" != "success" ]; then
            echo "::error::Unit tests failed"
            exit 1
          fi
          echo "All checks passed!"

      - name: Post summary
        run: |
          {
            echo "## PR Check Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Unit Tests | ${{ needs.full-ci.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
