name: Auto-Update GraphRAG

on:
  push:
    branches:
      - main
    paths:
      - 'src/lambdas/**'
      - 'src/entities/**'
      - 'src/lib/vendor/**'
      - 'graphrag/metadata.json'
      - 'tsp/**'

permissions: {}

jobs:
  update-graphrag:
    runs-on: [self-hosted, linux, arm64, node]
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read # read @j0nathan-ll0yd/* (Mantle framework + shared config) from GitHub Packages
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-node-pnpm

      - name: Generate dependency graph
        run: npx mantle generate graph

      - name: Update GraphRAG knowledge graph
        run: pnpm run graphrag:extract

      - name: Commit updated knowledge graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphrag/knowledge-graph.json
          if git diff --staged --quiet; then
            echo "No changes to knowledge graph"
          else
            git commit -m "chore: update GraphRAG knowledge graph"
            git push
          fi
